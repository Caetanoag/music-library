<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="css/main.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link
			href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		>
		<title>Music Library | Login</title>
	</head>

	<body>
		<section id="form-page" class="form-page">
			<div class="form-box" style="height:392px">
				<h2>Login</h2>
				<form id="auth-form" method="post">
					<div class="input-container">
						<label for="email">Endereço de Email: </label>
						<input
							type="email"
							name="email"
							id="email"
							placeholder="email@example.com"
						>
					</div>
					<div class="input-container">
						<label for="password">Senha: </label>
						<input
							type="password"
							name="password"
							id="password"
							placeholder="*****************"
						>
					</div>
					<p>
						Não tem uma conta?
						<a class="link-text" href="html/register.html">Crie uma.</a>
					</p>
					<button type="submit" id="form-submit" class="form-submit">
						Login
					</button>
				</form>
			</div>
		</section>
		<script type="module" src="js/main.js" defer></script>
	</body>
</html>

<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="../css/main.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link
			href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		>
		<title>Music Library | Minhas Músicas</title>
	</head>
	<body>
		<custom-header></custom-header>
		<main class="my-musics-page">
			<h1>Minhas músicas</h1>

			<section class="crud-form" aria-labelledby="form-title">
				<h2 id="form-title">Nova música</h2>
				<form id="music-form">
					<input type="hidden" id="music-id" name="id">
					<label for="title">Título *</label>
					<input type="text" id="title" name="title" required>

					<label for="artist">Artista *</label>
					<input type="text" id="artist" name="artist" required>

					<label for="album">Álbum</label>
					<input type="text" id="album" name="album">

					<div class="form-actions">
						<button type="submit" id="submit-button">Adicionar música</button>
						<button type="button" id="cancel-edit" hidden>
							Cancelar edição
						</button>
					</div>
				</form>
			</section>

			<p id="status" aria-live="polite"></p>

			<section aria-labelledby="list-title">
				<h2 id="list-title">Sua biblioteca</h2>
				<div id="music-list"></div>
			</section>
		</main>

		<script type="module" src="../js/main.js"></script>
	</body>
</html>

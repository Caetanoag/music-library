<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="../css/main.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link
			href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		>
		<title>Music Library | Register</title>
	</head>

	<body>
		<section id="form-page" class="form-page">
			<div class="form-box">
				<h2>Create account</h2>
				<form id="register-form" method="post">
					<div class="input-container">
						<label for="nome-completo">Nome Completo</label>
						<input type="text" name="nome-completo" id="nome-completo">
					</div>
					<div class="input-container">
						<label for="email">Endereço de email</label>
						<input
							type="email"
							name="email"
							id="email"
							placeholder="email@example.com"
						>
					</div>
					<div class="input-container">
						<label for="email-confirm">Repita seu email: </label>
						<input
							type="email"
							name="email-confirm"
							id="email-confirm"
							placeholder="email@example.com"
						>
					</div>
					<div class="input-container">
						<label for="password">Senha: </label>
						<input
							type="password"
							name="password"
							id="password"
							placeholder="*****************"
						>
					</div>
					<p>
						Já tem uma conta?
						<a class="link-text" href="../index.html">Faça login aqui.</a>
					</p>
					<button type="submit" id="form-submit" class="form-submit">
						Criar conta
					</button>
				</form>
			</div>
		</section>
		<script type="module" src="../js/auth.register.js"></script>
	</body>
</html>
